<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المسار للتوظيف">
<title>شركة المسار للتوظيف</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  :root{
    --paper:#EFEAE0;
    --card:#FFFDF8;
    --ink:#1B2A41;
    --ink-soft:#5B6B80;
    --border:#D9CDB8;
    --seal:#A23B3B;
    --teal:#2F6F62;
    --brass:#B8863B;
  }
  body[data-theme="dark"]{
    --paper:#141C2B;
    --card:#1E2A3E;
    --ink:#EDE7DA;
    --ink-soft:#93A1B5;
    --border:#334154;
    --seal:#D3685F;
    --teal:#4E9C8A;
    --brass:#D4A65C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Tajawal',sans-serif;color:var(--ink);transition:background .2s,color .2s;}
  .font-display{font-family:'Cairo',sans-serif;}
  a,button{font-family:inherit;}
  button{cursor:pointer;}

  .header{
    position:sticky;top:0;z-index:20;background:var(--ink);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;gap:10px;
  }
  body[data-theme="dark"] .header{background:#0D1420;}
  .logo{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--paper);}
  .logo .ring{width:34px;height:34px;border-radius:50%;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;}
  .logo span{font-size:18px;color:#F3EEE3;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{background:none;border:1px solid rgba(199,154,75,.35);color:var(--brass);border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
  .admin-btn{
    display:flex;align-items:center;gap:6px;font-size:13px;color:var(--brass);
    border:1px solid rgba(199,154,75,.35);border-radius:999px;padding:6px 14px;background:none;
  }

  .page{min-height:calc(100vh - 108px);padding:0 24px;}
  .center{max-width:920px;margin:0 auto;}
  .narrow{max-width:640px;margin:0 auto;}

  .seal{border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .seal::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed currentColor;opacity:.5;}

  .hero{text-align:center;padding:64px 0 24px;}
  .hero h1{font-size:2.4rem;line-height:1.25;margin:20px 0 12px;}
  .hero p{color:var(--ink-soft);max-width:560px;margin:0 auto;font-size:1.05rem;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px;}
  .cards.cards-two{max-width:760px;margin-left:auto;margin-right:auto;}
  @media(max-width:700px){.cards{grid-template-columns:1fr;}}
  .hint-note{color:var(--ink-soft);font-size:.85rem;margin-top:22px;}

  .choice-card{
    text-align:right;background:var(--card);border-radius:18px;padding:28px;
    border:2px solid transparent;transition:transform .15s ease;
  }
  .choice-card:hover{transform:translateY(-4px);}
  .choice-card.seal-b{border-color:rgba(162,59,59,.2);}
  .choice-card.teal-b{border-color:rgba(47,111,98,.2);}
  .choice-top{display:flex;justify-content:space-between;align-items:center;}
  .pill{font-size:12px;padding:4px 10px;border-radius:999px;}
  .choice-card h3{font-size:1.3rem;margin:16px 0 6px;}
  .choice-card p{color:var(--ink-soft);font-size:.9rem;margin:0;}
  .choice-link{margin-top:16px;font-size:.9rem;display:flex;align-items:center;gap:6px;}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:.9rem;background:none;border:none;margin:24px 0 12px;padding:0;}

  .form-title-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .form-title-row h2{margin:0;font-size:1.5rem;}
  .form-title-row p{margin:2px 0 0;color:var(--ink-soft);font-size:.88rem;}

  .card-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;display:grid;gap:16px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:600px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  label{display:block;}
  .lbl{font-size:.85rem;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .field-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--card);}
  .field-wrap svg{flex-shrink:0;color:var(--brass);}
  .field-wrap input,.field-wrap select,textarea.ta{
    width:100%;border:none;background:transparent;outline:none;padding:11px 0;font-size:.95rem;color:var(--ink);font-family:inherit;
  }
  .field-wrap-lg{padding:4px 16px;border-width:2px;border-color:var(--teal);}
  .field-wrap-lg input{padding:15px 0;font-size:1.15rem;font-family:'Cairo',sans-serif;letter-spacing:1px;}
  .field-wrap-lg svg{color:var(--teal);}
  textarea.ta{border:1px solid var(--border);border-radius:10px;padding:10px 12px;resize:vertical;}

  .btn{font-family:'Cairo',sans-serif;color:#fff;border:none;border-radius:10px;padding:13px;font-size:1rem;transition:opacity .15s;}
  .btn:hover{opacity:.9;}
  .btn-seal{background:var(--seal);}
  .btn-teal{background:var(--teal);}
  .btn-brass{background:var(--brass);}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn-sm{font-size:.8rem;padding:8px 14px;border-radius:8px;}
  .btn-wa{background:#25A366;}

  .toggle-link{background:none;border:none;font-size:.9rem;margin-top:20px;display:flex;align-items:center;gap:6px;padding:0;}

  .success-note{display:flex;flex-direction:column;gap:10px;border-radius:10px;padding:14px;font-size:.88rem;margin-top:4px;}
  .success-note .row{display:flex;align-items:center;gap:8px;}
  .track-code-box{font-family:'Cairo',sans-serif;font-size:1.1rem;letter-spacing:1px;background:var(--card);border:1px dashed currentColor;border-radius:8px;padding:8px 12px;display:inline-block;}

  .search-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--card);margin:16px 0 12px;}
  .search-wrap input{border:none;background:transparent;outline:none;padding:11px 0;width:100%;font-size:.9rem;color:var(--ink);font-family:inherit;}

  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .filters-row select{font-size:.8rem;border-radius:8px;border:1px solid var(--border);padding:8px 10px;background:var(--card);color:var(--ink);font-family:inherit;}

  .list-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .li-name{font-family:'Cairo',sans-serif;font-size:.98rem;margin:0;}
  .li-sub{font-size:.85rem;margin:3px 0 0;}
  .li-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--ink-soft);margin-top:10px;}
  .li-meta span{display:flex;align-items:center;gap:4px;}
  .li-note{font-size:.8rem;color:var(--ink-soft);margin-top:8px;}
  .empty-note{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:28px 0;}
  .del-btn{border:none;border-radius:8px;padding:8px;flex-shrink:0;}
  .item-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}

  .verified-badge{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;background:#2F6F6218;color:var(--teal);padding:2px 8px;border-radius:999px;margin-right:6px;}
  .verify-toggle{font-size:.7rem;background:none;border:1px solid var(--border);border-radius:8px;padding:4px 8px;color:var(--ink-soft);margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
  .verify-toggle.on{border-color:var(--teal);color:var(--teal);}

  .status-badge{font-size:.72rem;padding:4px 10px;border-radius:999px;font-family:'Tajawal',sans-serif;white-space:nowrap;}
  .status-select{font-size:.75rem;border-radius:8px;border:1px solid var(--border);padding:5px 8px;background:var(--card);color:var(--ink);font-family:inherit;}

  .file-field{border:1px dashed var(--border);border-radius:10px;padding:10px 12px;background:var(--card);}
  .file-field input[type=file]{width:100%;font-size:.8rem;color:var(--ink-soft);font-family:inherit;}
  .file-field input[type=file]::file-selector-button{
    font-family:'Tajawal',sans-serif;border:none;background:var(--brass);color:#fff;border-radius:7px;
    padding:6px 12px;font-size:.78rem;margin-left:10px;cursor:pointer;
  }
  .doc-preview{margin-top:8px;display:none;align-items:center;gap:8px;}
  .doc-preview img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .doc-preview span{font-size:.75rem;color:var(--teal);}
  .doc-preview.file-ok{display:flex;}
  .doc-preview .file-chip{font-size:.75rem;color:var(--teal);background:#2F6F6214;padding:4px 10px;border-radius:6px;}

  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0;}
  .docs-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .doc-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:transform .1s;}
  .doc-thumb:hover{transform:scale(1.08);}
  .doc-label{font-size:.68rem;color:var(--ink-soft);text-align:center;margin-top:3px;}
  .doc-item{display:flex;flex-direction:column;align-items:center;}

  .lightbox{position:fixed;inset:0;background:rgba(27,42,65,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .lightbox img{max-width:90vw;max-height:85vh;border-radius:10px;}
  .lightbox-close{position:absolute;top:20px;left:20px;background:var(--paper);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}

  .admin-login-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;background:var(--ink);}
  .admin-login-card{width:100%;max-width:380px;background:var(--paper);border-radius:18px;padding:32px;text-align:center;}
  .admin-login-card h2{margin:14px 0 2px;font-size:1.3rem;}
  .admin-login-card p{color:var(--ink-soft);font-size:.85rem;margin:0 0 20px;}
  .code-input{width:100%;text-align:center;letter-spacing:3px;font-size:1.1rem;border-radius:10px;border:1px solid var(--border);padding:13px;outline:none;background:var(--card);color:var(--ink);}
  .code-input.err{border-color:var(--seal);}
  .err-msg{color:var(--seal);font-size:.78rem;margin-top:8px;}
  .cancel-link{background:none;border:none;color:var(--ink-soft);font-size:.85rem;margin-top:16px;}
  .lock-msg{color:var(--seal);font-size:.8rem;margin-top:10px;background:#A23B3B14;border-radius:8px;padding:10px;}
  .role-pick-row{display:flex;gap:14px;justify-content:center;margin-top:8px;}
  .role-pick-btn{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    width:110px;padding:20px 10px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);font-size:.9rem;font-family:'Cairo',sans-serif;
    transition:transform .12s ease,border-color .12s ease;
  }
  .role-pick-btn:hover{transform:translateY(-3px);border-color:var(--brass);}
  .role-pick-btn svg{color:var(--brass);}

  .dash-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .dash-title{display:flex;align-items:center;gap:12px;}
  .dash-title h2{margin:0;font-size:1.3rem;}
  .dash-title p{margin:2px 0 0;font-size:.78rem;color:var(--ink-soft);}
  .role-chip{font-size:.68rem;background:var(--brass);color:#fff;padding:2px 8px;border-radius:999px;margin-right:6px;}
  .logout-btn{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--seal);border:1px solid rgba(162,59,59,.3);border-radius:10px;padding:8px 14px;background:none;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{font-size:.85rem;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);}
  .tab-btn.active-emp{background:var(--seal);color:#fff;border-color:var(--seal);}
  .tab-btn.active-comp{background:var(--teal);color:#fff;border-color:var(--teal);}
  .tab-btn.active-stats{background:var(--brass);color:#fff;border-color:var(--brass);}
  .tab-btn.active-audit{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

  .match-box{margin-top:12px;background:#B8863B0F;border:1px dashed var(--brass);border-radius:10px;padding:10px 12px;}
  .match-box p{margin:0 0 6px;font-size:.78rem;color:var(--brass);font-family:'Cairo',sans-serif;}
  .match-chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px;margin:2px 4px 2px 0;}

  .admin-note-box{margin-top:10px;}
  .admin-note-box textarea{width:100%;font-size:.78rem;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--card);font-family:inherit;resize:vertical;min-height:44px;color:var(--ink);}
  .admin-note-box .save-note{font-size:.72rem;margin-top:4px;color:var(--teal);background:none;border:none;padding:0;}

  .banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#B8863B14;border:1px solid rgba(184,134,59,.35);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.82rem;color:var(--brass);flex-wrap:wrap;}

  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
  .stat-card .num{font-family:'Cairo',sans-serif;font-size:1.6rem;color:var(--ink);}
  .stat-card .lbl2{font-size:.78rem;color:var(--ink-soft);margin-top:4px;}
  .bar-block{margin-bottom:10px;}
  .bar-block .bar-top{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px;}
  .bar-track{background:var(--border);border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .stats-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  .stats-section h4{margin:0 0 14px;font-size:1rem;font-family:'Cairo',sans-serif;}

  .audit-row{font-size:.8rem;border-bottom:1px solid var(--border);padding:9px 0;display:flex;justify-content:space-between;gap:10px;color:var(--ink-soft);}
  .audit-row b{color:var(--ink);font-weight:600;}

  .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px;font-size:.85rem;}
  .pagination button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--ink);}
  .pagination button:disabled{opacity:.4;cursor:default;}

  .group-heading{font-family:'Cairo',sans-serif;font-size:.95rem;margin:18px 0 8px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .group-heading .cnt{font-size:.72rem;background:var(--teal);color:#fff;padding:2px 8px;border-radius:999px;font-family:'Tajawal',sans-serif;}

  .footer-bar{background:var(--ink);color:#C6CBD4;text-align:center;padding:14px;font-size:.78rem;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  body[data-theme="dark"] .footer-bar{background:#0D1420;}
  .footer-bar a{color:var(--brass);text-decoration:none;}
  .privacy-modal-overlay{position:fixed;inset:0;background:rgba(27,42,65,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .privacy-modal{background:var(--paper);border-radius:16px;padding:24px;max-width:480px;max-height:80vh;overflow:auto;}
  .privacy-modal h3{margin-top:0;font-size:1.15rem;}
  .privacy-modal p{font-size:.85rem;color:var(--ink-soft);line-height:1.8;}

  .loading{text-align:center;padding:80px 0;color:var(--ink-soft);}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .stamp-in{animation:stampIn .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}60%{transform:scale(.94) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}

  @media print{
    .header,.footer-bar,.admin-toolbar,.del-btn,.logout-btn,.tabs,.search-wrap,.pagination,.back-link,.filters-row,.toggle-link,.item-actions,.icon-btn,.banner{display:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONFIG — update these for your business
   ========================================================= */
const CONTACT_PHONE = "9647700000000"; // WhatsApp number (international format, no +) — CHANGE ME
const DEFAULT_ROLE_CODES = {

const MAX_LOGIN_ATTEMPTS = 5;

  "قيد المراجعة":"#B8863B","تم التواصل":"#2F6F62","تم الترشيح لوظيفة":"#1B2A41",
  "تم التوظيف":"#2F6F62","غير مهتم":"#A23B3B"
};

/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
  phone: '<path d="M13.4 2.6a2 2 0 0 1 2.9 0l2.1 2.1a2 2 0 0 1 0 2.9l-1.2 1.2c-1 1-2.7.8-4-.5l-3-3c-1.3-1.3-1.5-3-.5-4Z"/><path d="M8.5 15.5c2.5 2.5 5.6 4 8 4a2 2 0 0 0 1.4-.6L19 17.7a2 2 0 0 0 0-2.9l-2.1-2.1a2 2 0 0 0-2.9 0l-1 1"/>',
  mapPin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  building: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',
  shield: '<path d="M12 2 4 5v6c0 5 3.6 8.6 8 11 4.4-2.4 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/>',
  trash: '<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-5"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  stamp: '<path d="M5 22h14"/><path d="M9 22v-3a3 3 0 0 1 6 0v3"/><circle cx="12" cy="9" r="6"/><path d="M12 6v3l2 2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',

/* =========================================================

async function loadData(){
  try{ const emp = await window.storage.get("employees_list"); if(emp) state.employees = JSON.parse(emp.value); }catch(e){}
  try{ const comp = await window.storage.get("companies_list"); if(comp) state.companies = JSON.parse(comp.value); }catch(e){}
  try{ const codes = await window.storage.get("role_codes"); if(codes) state.roleCodes = {...DEFAULT_ROLE_CODES, ...JSON.parse(codes.value)}; }catch(e){}
  try{ const log = await window.storage.get("audit_log"); if(log) state.auditLog = JSON.parse(log.value); }catch(e){}
  try{ const th = await window.storage.get("theme"); if(th) state.theme = th.value; }catch(e){}
  try{ const bk = await window.storage.get("last_backup_at"); if(bk) state.lastBackupAt = Number(bk.value); }catch(e){}
  state.loaded = true;
  applyTheme();
  render();
}
async function saveEmployees(){ try{ await window.storage.set("employees_list", JSON.stringify(state.employees)); }catch(e){} }
async function saveCompanies(){ try{ await window.storage.set("companies_list", JSON.stringify(state.companies)); }catch(e){} }
async function saveRoleCodes(){ try{ await window.storage.set("role_codes", JSON.stringify(state.roleCodes)); }catch(e){} }
async function saveAuditLog(){ try{ await window.storage.set("audit_log", JSON.stringify(state.auditLog)); }catch(e){} }
async function saveTheme(){ try{ await window.storage.set("theme", state.theme); }catch(e){} }
async function saveLastBackup(){ try{ await window.storage.set("last_backup_at", String(state.lastBackupAt)); }catch(e){} }

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s=""){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function go(view){
  state.view = view;
  state.searchQ = "";
  if(view === "adminLogin"){ state.loginRoleChoice = null; state.adminError = false; }
  render();
  window.scrollTo(0,0);
}
function genTrackCode(id){ return "MSR-" + String(id).slice(-6); }
function filterList(list, q, fields){
  if(!q) return list;
  return list.filter(item => fields.map(f=>item[f]||"").join(" ").includes(q));
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function csvEscape(v){ v = String(v==null?"":v); if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"'; return v; }
function applyTheme(){ document.body.setAttribute('data-theme', state.theme); }
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveTheme(); render();
}
function logAudit(action, details){
  state.auditLog.unshift({ ts: Date.now(), role: state.adminRole || "-", action, details });
  if(state.auditLog.length > 200) state.auditLog = state.auditLog.slice(0,200);
  saveAuditLog();
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ar-IQ', {year:'numeric',month:'short',day:'numeric'}) + " " + d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
}
function monthLabel(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ar-IQ', {year:'numeric', month:'short'});
}

function suggestCandidates(company){
  const role = (company.title||"").trim();
  const city = (company.city||"").trim();
  if(!role && !city) return [];
  return state.employees.filter(e=>{
    const roleMatch = !!(role && e.role && (e.role.includes(role) || role.includes(e.role)));
    const cityMatch = !!(city && e.city && e.city.includes(city));
    return roleMatch || cityMatch;
  }).slice(0,3);
}

  const total = state.employees.length;
  const hired = state.employees.filter(e=>e.status==="تم التوظيف").length;
  const conv = total ? Math.round((hired/total)*100) : 0;

  const roleCounts = {};
  state.employees.forEach(e=>{ roleCounts[e.role] = (roleCounts[e.role]||0)+1; });
  const topRoles = Object.entries(roleCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const cityCounts = {};
  state.employees.forEach(e=>{ if(e.city) cityCounts[e.city] = (cityCounts[e.city]||0)+1; });

  state.employees.forEach(e=>{ const m = monthLabel(e.id); monthCounts[m] = (monthCounts[m]||0)+1; });
  const months = Object.entries(monthCounts).slice(-6);

  const maxRole = Math.max(1, ...topRoles.map(r=>r[1]));
  const maxCity = Math.max(1, ...topCities.map(c=>c[1]));

  </div>

  <div class="stats-section">
    <h4>${icon('chart',16)} التسجيلات حسب الشهر</h4>
    ${months.length===0?`<p class="empty-note">لا توجد بيانات كافية بعد.</p>`:months.map(([m,c])=>`
      <div class="bar-block">
        <div class="bar-top"><span>${esc(m)}</span><span>${c}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c/maxMonth)*100}%;background:var(--brass);"></div></div>
      </div>`).join("")}
  </div>

  <div class="stats-section">
    <h4>${icon('briefcase',16)} أكثر المهن تسجيلًا</h4>
    ${topRoles.length===0?`<p class="empty-note">لا توجد بيانات بعد.</p>`:topRoles.map(([r,c])=>`
      <div class="bar-block">
        <div class="bar-top"><span>${esc(r)}</span><span>${c}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c/maxRole)*100}%;background:var(--seal);"></div></div>
      </div>`).join("")}
  </div>

  <div class="stats-section">
    <h4>${icon('mapPin',16)} أكثر المدن تسجيلًا</h4>
    ${topCities.length===0?`<p class="empty-note">لا توجد بيانات بعد.</p>`:topCities.map(([ci,c])=>`
      <div class="bar-block">

let pendingFiles = {};
function handleDocFile(inputId){
  const input = document.getElementById(inputId);
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.type === 'application/pdf'){
    const reader = new FileReader();
    reader.onload = function(ev){
      pendingFiles[inputId] = ev.target.result;
      const preview = document.getElementById(inputId + '-preview');
      const lbl = document.getElementById(inputId + '-label');
      if(preview){ preview.classList.add('file-ok'); preview.style.display='flex'; }
      if(lbl) lbl.innerHTML = icon('check',13) + ' تم إرفاق السيرة الذاتية (PDF)';
    };
    reader.readAsDataURL(file);
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      pendingFiles[inputId] = dataUrl;
      const preview = document.getElementById(inputId + '-preview');
      const previewImg = document.getElementById(inputId + '-img');
      if(preview && previewImg){
        previewImg.src = dataUrl; previewImg.style.display='block';
        preview.style.display = 'flex';
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPendingFiles(){ pendingFiles = {}; }

function submitSeeker(e){
  e.preventDefault();
  const name = document.getElementById('sk-name').value.trim();
  const phone = document.getElementById('sk-phone').value.trim();
  const roleSel = document.getElementById('sk-role').value;
  const role = roleSel === 'أخرى' ? (document.getElementById('sk-role-other').value.trim() || 'أخرى') : roleSel;
  if(!name || !phone || !role) return;

  const dup = state.employees.some(emp => emp.phone === phone);
  if(dup){
    const proceed = confirm("هذا الرقم مسجّل مسبقًا في المنصّة. هل تريد المتابعة وتسجيل ملف إضافي بنفس الرقم؟");
    if(!proceed) return;
  }

  const id = Date.now();
  const entry = {
    id, trackCode: genTrackCode(id),
    name, phone, role,
    years: document.getElementById('sk-years').value,
    city: document.getElementById('sk-city').value.trim(),
    note: document.getElementById('sk-note').value.trim(),
    photo: pendingFiles['sk-photo'] || "",
    idFront: pendingFiles['sk-idfront'] || "",
    idBack: pendingFiles['sk-idback'] || "",
    resFront: pendingFiles['sk-resfront'] || "",
    resBack: pendingFiles['sk-resback'] || "",
    cv: pendingFiles['sk-cv'] || "",
    status: "قيد المراجعة",
    adminNote: "",
    verified: false
  };
  state.employees.unshift(entry);
  saveEmployees();
  clearPendingFiles();
  state.seekerDone = true;
  state.lastTrackCode = entry.trackCode;
  render();
}

function submitTrack(e){
  e.preventDefault();
  const code = document.getElementById('tr-code').value.trim();
  const phone = document.getElementById('tr-phone').value.trim();
  const found = state.employees.find(emp => emp.trackCode === code && emp.phone === phone);
  state.trackResult = found || null;
  render();
}

/* =========================================================
   ACTIONS — company
   ========================================================= */
function submitCompany(e){
  e.preventDefault();
  const company = document.getElementById('co-company').value.trim();
  const title = document.getElementById('co-title').value.trim();
  const contact = document.getElementById('co-contact').value.trim();
  if(!company || !title || !contact) return;
  const btypeSel = document.getElementById('co-btype').value;
  const btype = btypeSel === 'أخرى' ? (document.getElementById('co-btype-other').value.trim() || 'أخرى') : btypeSel;
  const entry = {
    id: Date.now(),
    company, title, contact,
    city: document.getElementById('co-city').value.trim(),
    type: document.getElementById('co-type').value,
    businessType: btype,
    workHours: document.getElementById('co-hours').value,
    desc: document.getElementById('co-desc').value.trim()
  };
  state.companies.unshift(entry);
  saveCompanies();
  logAudit("إضافة طلب توظيف", `${entry.title} — ${entry.company}`);
  state.companyDone = true;
  render();
  setTimeout(()=>{ state.companyDone=false; render(); }, 3500);
}

/* =========================================================
   ACTIONS — admin auth
   ========================================================= */
function chooseLoginRole(role){
  state.loginRoleChoice = role;
  state.adminError = false;
  render();
}
function codeToRole(code){
  for(const r in state.roleCodes){ if(state.roleCodes[r] === code) return r; }
  return null;
}
function submitAdminCode(e){
  e.preventDefault();
  if(state.lockoutUntil > Date.now()) return;
  const val = document.getElementById('admin-code').value.trim();
  const role = codeToRole(val);
  if(role && role === state.loginRoleChoice){
    state.adminError = false;
    state.loginAttempts = 0;
    state.adminRole = role;
    state.view = "admin";
    state.adminTab = "employees";
    state.searchQ = "";
    render();
  } else {
    state.adminError = true;
    state.loginAttempts++;
    if(state.loginAttempts >= MAX_LOGIN_ATTEMPTS){
      state.lockoutUntil = Date.now() + LOCKOUT_MS;
      state.loginAttempts = 0;
      setTimeout(()=>{ render(); }, LOCKOUT_MS + 100);
    }
    render();
  }
}
function clearAdminError(){ if(state.adminError){ state.adminError=false; } }
function adminLogout(){
  state.view="home"; state.adminRole=null; state.loginRoleChoice=null;
  state.adminAddingCompany=false; state.showChangeCode=false; render();
}

/* =========================================================
   ACTIONS — admin dashboard
   ========================================================= */
function setAdminTab(tab){
  state.adminTab = tab; state.searchQ=""; state.adminAddingCompany=false; state.showChangeCode=false;
  state.filterStatus=""; state.filterCity=""; state.filterRole=""; state.empPage=1; state.compPage=1;
  render();
}
function toggleAdminAddCompany(){ state.adminAddingCompany = !state.adminAddingCompany; render(); }
function toggleGroupCompanies(){ state.groupCompanies = !state.groupCompanies; state.compPage=1; render(); }
function setFilter(key, val){ state[key] = val; state.empPage = 1; render(); }
function setPage(key, val){ state[key] = val; render(); window.scrollTo(0,0); }

function removeEmployee(id){
  if(state.adminRole !== 'manager') return;
  const emp = state.employees.find(e=>e.id===id);
  state.employees = state.employees.filter(e=>e.id!==id);
  saveEmployees();
  logAudit("حذف باحث عن عمل", emp?emp.name:String(id));
  render();
}
function removeCompany(id){
  if(state.adminRole !== 'manager') return;
  const c = state.companies.find(x=>x.id===id);
  state.companies = state.companies.filter(c=>c.id!==id);
  saveCompanies();
  logAudit("حذف طلب توظيف", c?(c.title+' — '+c.company):String(id));
  render();
}
function updateStatus(id, val){
  const emp = state.employees.find(e=>e.id===id);
  if(emp){
    const old = emp.status;
    emp.status = val;
    saveEmployees();
    logAudit("تغيير حالة", `${emp.name}: ${old} ← ${val}`);
    render();
  }
}
function toggleVerified(id){
  if(state.adminRole !== 'manager') return;
  const emp = state.employees.find(e=>e.id===id);
  if(emp){
    emp.verified = !emp.verified;
    saveEmployees();
    logAudit(emp.verified?"تمييز كموثّق":"إلغاء التوثيق", emp.name);
    render();
  }
}
function saveAdminNote(id){
  if(state.adminRole !== 'manager') return;
  const emp = state.employees.find(e=>e.id===id);
  const ta = document.getElementById('note-'+id);
  if(emp && ta){ emp.adminNote = ta.value; saveEmployees(); logAudit("تعديل ملاحظة داخلية", emp.name); }
}
function onSearch(v){ state.searchQ = v; state.empPage=1; state.compPage=1; render(); focusSearchInput(); }
function focusSearchInput(){
  const inp = document.querySelector('.search-wrap input');
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}
function openLightbox(src){ state.lightboxSrc = src; render(); }
function closeLightbox(){ state.lightboxSrc = null; render(); }

function toggleChangeCode(){
  state.showChangeCode = !state.showChangeCode;
  state.changeCodeErr = ""; state.changeCodeMsg = "";
  render();
}
function submitChangeCode(e){
  e.preventDefault();
  const isManager = state.adminRole === "manager";
  const targetLabel = isManager ? document.getElementById('cc-target').value : null;
  const target = isManager ? (targetLabel === "الإدارة" ? "manager" : "reception") : state.adminRole;
  const oldCode = document.getElementById('cc-old').value.trim();
  const newCode = document.getElementById('cc-new').value.trim();
  const newCode2 = document.getElementById('cc-new2').value.trim();
  state.changeCodeMsg = "";
  if(!oldCode || !newCode || !newCode2){ state.changeCodeErr = "الرجاء تعبئة كل الحقول."; render(); return; }
  if(state.roleCodes[target] !== oldCode){ state.changeCodeErr = "الرمز الحالي غير صحيح."; render(); return; }
  if(newCode.length < 6){ state.changeCodeErr = "الرمز الجديد قصير جدًا (6 أحرف على الأقل)."; render(); return; }
  if(newCode !== newCode2){ state.changeCodeErr = "الرمز الجديد وتأكيده غير متطابقين."; render(); return; }
  state.roleCodes[target] = newCode;
  saveRoleCodes();
  logAudit("تغيير رمز الدخول", target === 'manager' ? 'الإدارة' : 'الاستقبال');
  state.changeCodeErr = "";
  state.changeCodeMsg = "تم تغيير الرمز بنجاح.";
  render();
}

/* =========================================================
   ACTIONS — exports & print
   ========================================================= */
function exportCSV(kind){
  let rows, filename;
  if(kind === 'employees'){
    rows = [["الاسم","الهاتف","المهنة","سنوات الخبرة","المدينة","الحالة","موثّق","رمز المتابعة","ملاحظة الإدارة"]];
    state.employees.forEach(e=>rows.push([e.name,e.phone,e.role,e.years,e.city,e.status,e.verified?"نعم":"لا",e.trackCode,e.adminNote]));
    filename = "الباحثون_عن_عمل.csv";
  } else {
    rows = [["اسم الشركة","المسمى الوظيفي","المدينة","نوع الدوام","نوع النشاط","ساعات العمل","رقم التواصل","الوصف"]];
    state.companies.forEach(c=>rows.push([c.company,c.title,c.city,c.type,c.businessType,c.workHours,c.contact,c.desc]));
    filename = "طلبات_التوظيف.csv";
  }
  const csv = "\uFEFF" + rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  downloadBlob(csv, filename, "text/csv;charset=utf-8;");
  logAudit("تصدير CSV", kind==='employees'?'الباحثون عن عمل':'الشركات');
}
function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    employees: state.employees.map(e=>({...e, idFront:undefined, idBack:undefined, resFront:undefined, resBack:undefined, photo:undefined, cv:undefined})),
    companies: state.companies
  };
  downloadBlob(JSON.stringify(data, null, 2), `نسخة_احتياطية_${new Date().toISOString().slice(0,10)}.json`, "application/json");
  state.lastBackupAt = Date.now();
  saveLastBackup();
  logAudit("تصدير نسخة احتياطية", "");
  render();
}

function printCandidate(id){
  const e = state.employees.find(x=>x.id===id);
  if(!e) return;
  const win = window.open('', '_blank', 'width=650,height=800');
  if(!win) return;
  win.document.write(`
  <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>ملف ${esc(e.name)}</title>
  <style>
    body{font-family:Tajawal,Arial,sans-serif;padding:32px;color:#1B2A41;}
    h1{font-size:22px;border-bottom:2px solid #A23B3B;padding-bottom:10px;}
    .row{margin:10px 0;font-size:15px;}
    .row b{display:inline-block;width:140px;color:#5B6B80;}
    .photo{width:100px;height:100px;border-radius:50%;object-fit:cover;float:left;border:2px solid #D9CDB8;}
    .badge{display:inline-block;background:#2F6F6218;color:#2F6F62;padding:3px 10px;border-radius:999px;font-size:12px;margin-right:6px;}
  </style></head><body>
    ${e.photo?`<img class="photo" src="${e.photo}"/>`:""}
    <h1>${esc(e.name)} ${e.verified?'<span class="badge">موثّق</span>':''}</h1>
    <div class="row"><b>المهنة:</b> ${esc(e.role)}</div>
    <div class="row"><b>سنوات الخبرة:</b> ${esc(e.years||'-')}</div>
    <div class="row"><b>المدينة:</b> ${esc(e.city||'-')}</div>
    <div class="row"><b>رقم الهاتف:</b> ${esc(e.phone)}</div>
    <div class="row"><b>الحالة:</b> ${esc(e.status||'-')}</div>
    <div class="row"><b>رمز المتابعة:</b> ${esc(e.trackCode||'-')}</div>
    ${e.note?`<div class="row"><b>نبذة:</b> ${esc(e.note)}</div>`:""}
    <hr style="margin-top:30px;border:none;border-top:1px solid #D9CDB8;">
    <p style="font-size:12px;color:#5B6B80;">شركة المسار للتوظيف — صادر بتاريخ ${new Date().toLocaleDateString('ar-IQ')}</p>
    <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`);
  win.document.close();
}

   INIT
   ========================================================= */
render();
loadData();
</script>
